<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Inscription — Réunion maternelle</title>
<style>
  :root{
    --bg:#050508;--s1:#0a0a10;--s2:#0f0f18;--s3:#151520;--s4:#1a1a28;
    --ac:#6c63ff;--ac2:#8b85ff;--ac3:#b0acff;
    --cyan:#00d4ff;--green:#00ff88;--rose:#ff6b9d;--gold:#f2a516;
    --border:rgba(108,99,255,0.18);--border2:rgba(108,99,255,0.32);
    --text:#f0eeff;--t2:#a8a2d6;--t3:#6b6790;--r:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:system-ui,'Segoe UI',sans-serif;background:radial-gradient(1200px 600px at 50% -10%,rgba(108,99,255,0.18),transparent),var(--bg);color:var(--text);line-height:1.55;min-height:100vh;padding:0 0 60px;}
  .wrap{max-width:620px;margin:0 auto;padding:0 18px;}
  header.hero{background:linear-gradient(135deg,#2a1daa,#6c63ff);padding:30px 18px 26px;text-align:center;border-radius:0 0 28px 28px;box-shadow:0 10px 40px rgba(108,99,255,0.25);}
  .hero .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;background:rgba(255,255,255,0.18);color:#fff;padding:5px 14px;border-radius:20px;margin-bottom:12px;}
  .hero h1{font-size:24px;color:#fff;line-height:1.2;text-wrap:balance;}
  .hero .sub{color:rgba(255,255,255,0.9);font-size:14px;margin-top:8px;}
  .infos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px;}
  .info{background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;}
  .info .k{font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--t3);font-weight:700;}
  .info .v{font-size:15px;font-weight:700;color:var(--text);margin-top:2px;font-variant-numeric:tabular-nums;}
  .info .v small{display:block;font-size:11px;font-weight:600;color:var(--t2);}
  @media (max-width:460px){ .infos{grid-template-columns:1fr;} }
  .section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--ac3);margin:24px 0 12px;}
  form,.card{background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-top:14px;}
  .fg{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
  label.lbl,.lbl{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--t3);font-weight:700;}
  input[type=text]{background:var(--s1);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:12px 12px;font-size:16px;font-family:inherit;width:100%;}
  input[type=text]:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(108,99,255,0.2);}
  .hint{font-size:12px;color:var(--t3);}
  .choix{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .choix label{position:relative;display:flex;flex-direction:column;gap:2px;padding:12px 14px 12px 42px;cursor:pointer;border:1px solid var(--border2);border-radius:12px;background:var(--s1);font-weight:700;font-size:15px;color:var(--text);}
  .choix label span{font-weight:500;font-size:12px;color:var(--t2);}
  .choix input{position:absolute;left:14px;top:16px;width:18px;height:18px;margin:0;accent-color:var(--ac);}
  .choix label:has(input:checked){border-color:var(--ac);background:rgba(108,99,255,0.14);box-shadow:0 0 0 3px rgba(108,99,255,0.15);}
  @media (max-width:460px){ .choix{grid-template-columns:1fr;} }
  .stepper{display:inline-flex;align-items:stretch;border:1px solid var(--border2);border-radius:12px;overflow:hidden;background:var(--s1);}
  .stepper button{font:inherit;font-size:22px;font-weight:700;width:50px;border:0;background:transparent;color:var(--ac3);cursor:pointer;}
  .stepper button:hover{background:rgba(108,99,255,0.18);}
  .stepper output{min-width:64px;display:grid;place-items:center;font-size:22px;font-weight:700;border-inline:1px solid var(--border2);font-variant-numeric:tabular-nums;}
  .fg[hidden]{display:none;}
  .err{display:none;background:rgba(255,107,157,0.12);border:1px solid rgba(255,107,157,0.4);color:var(--rose);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px;}
  button.submit{width:100%;background:linear-gradient(135deg,#3a2bcc,var(--ac));border:none;color:#fff;padding:15px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 6px 24px rgba(108,99,255,0.35);font-family:inherit;}
  button.submit:hover{filter:brightness(1.08);}
  button.submit:disabled{opacity:0.6;cursor:wait;}
  .notice{background:rgba(242,165,22,0.12);border:1px solid rgba(242,165,22,0.4);color:#ffd98a;border-radius:var(--r);padding:12px 16px;font-size:13px;margin-top:16px;}
  .done{text-align:center;padding:28px 18px;}
  .done .big{font-size:44px;line-height:1;margin-bottom:10px;}
  .done h2{font-size:22px;color:#fff;margin-bottom:8px;}
  .done p{color:var(--t2);font-size:14px;}
  .recap{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin:16px 0;text-align:left;font-size:15px;}
  .recap b{color:#fff;}
  .link{background:none;border:none;color:var(--ac3);font-size:14px;font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-family:inherit;}
  .closed{text-align:center;padding:30px 18px;}
  .closed .big{font-size:44px;line-height:1;margin-bottom:10px;}
  .closed h2{font-size:22px;color:#fff;margin-bottom:8px;}
  .closed p{color:var(--t2);font-size:14px;}
  .foot{text-align:center;font-size:12px;color:var(--t3);margin-top:24px;}
</style>
</head>
<body>
<header class="hero">
  <div class="tag">Note aux familles</div>
  <h1 id="h-titre">Réunion d'information périscolaire maternelle</h1>
  <div class="sub" id="h-sub"></div>
</header>
<div class="wrap" id="content"></div>

<script>
// ── Lecture de la configuration encodée dans le lien (généré par ARIA) ──
function decodePayload(){
  const p = new URLSearchParams(location.search).get('d');
  if(!p) return null;
  try { const b64 = p.replace(/-/g,'+').replace(/_/g,'/'); return JSON.parse(decodeURIComponent(escape(atob(b64)))); }
  catch(e){ return null; }
}
const data = decodePayload();
const esc = s => (''+(s==null?'':s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const content = document.getElementById('content');
let liveCloseAt = data && data.c ? data.c : '';   // clôture (ISO), éventuellement mise à jour depuis la base
let liveClosed = false;                            // fermeture manuelle publiée depuis ARIA
let nombre = 1;
const STORE = 'aria-reunion-reponse';

function fmtDateLong(d){ try{ return new Date(d+'T00:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}); }catch(e){ return d||''; } }
function fmtDateShort(d){ try{ return new Date(d+'T00:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'short'}); }catch(e){ return d||''; } }
function fmtCloture(iso){
  if(!iso) return '';
  // Toujours en heure de Paris, quel que soit le réglage du téléphone
  try{ const d=new Date(iso); const tz={timeZone:'Europe/Paris'}; return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',...tz})+' à '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',...tz}).replace(':','h'); }catch(e){ return iso; }
}
function isClosed(){
  if(liveClosed) return true;
  if(!liveCloseAt) return false;
  const t = Date.parse(liveCloseAt);
  return !isNaN(t) && Date.now() >= t;
}
function cap(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }

function headerBlocks(){
  const dateTxt = data.d ? cap(fmtDateShort(data.d)) : '';
  const clot = liveCloseAt ? cap(fmtCloture(liveCloseAt)) : '';
  return `
  <div class="infos">
    <div class="info"><div class="k">Date</div><div class="v">${esc(dateTxt||'—')}</div></div>
    <div class="info"><div class="k">Heure</div><div class="v">${esc(data.h||'—')}${data.l?`<small>${esc(data.l)}</small>`:''}</div></div>
    <div class="info"><div class="k">Inscriptions</div><div class="v">${clot?`jusqu'au<small>${esc(clot)}</small>`:'ouvertes'}</div></div>
  </div>`;
}

function formBlock(){
  return `
  <div class="section-title">Votre réponse</div>
  <form id="form" onsubmit="return false;">
    <div class="fg">
      <label class="lbl" for="famille">Nom de la famille *</label>
      <input type="text" id="famille" maxlength="80" autocomplete="family-name" placeholder="Ex. : Famille Dupont"/>
      <div class="hint">Le nom sous lequel votre enfant est inscrit à l'école.</div>
    </div>
    <div class="fg">
      <div class="lbl">Serez-vous présent·e à la réunion ? *</div>
      <div class="choix">
        <label><input type="radio" name="presence" id="p-oui" value="oui" checked/>Oui, je viens<span>Une ou plusieurs personnes</span></label>
        <label><input type="radio" name="presence" id="p-non" value="non"/>Non, je ne pourrai pas<span>Merci de nous le dire quand même</span></label>
      </div>
    </div>
    <div class="fg" id="fg-nombre">
      <label class="lbl" for="nombre">Nombre de personnes</label>
      <div class="stepper">
        <button type="button" id="moins" aria-label="Une personne de moins">−</button>
        <output id="nombre">1</output>
        <button type="button" id="plus" aria-label="Une personne de plus">+</button>
      </div>
      <div class="hint">Adultes qui assisteront à la réunion, vous compris·e.</div>
    </div>
    <div class="err" id="err"></div>
    <button class="submit" id="btn" onclick="submitForm()">📨 Je m'inscris</button>
  </form>
  <div class="foot">Seuls le nom de la famille, la présence et le nombre de personnes sont enregistrés.</div>`;
}

function closedBlock(){
  return `
  <div class="card closed">
    <div class="big">🔒</div>
    <h2>Les inscriptions sont terminées</h2>
    <p>${liveCloseAt?`Elles se sont clôturées le ${esc(fmtCloture(liveCloseAt))}.`:'Elles ont été fermées par l\'organisateur.'}${data.d?` La réunion a lieu le ${esc(fmtDateLong(data.d))}${data.h?' à '+esc(data.h):''} : vous êtes bien sûr les bienvenus.`:''}</p>
  </div>`;
}

function doneBlock(r, online){
  const rec = r.presence==='oui'
    ? `<span>Présente à la réunion · <b>${r.nombre} ${r.nombre>1?'personnes':'personne'}</b></span>`
    : `<span>Ne pourra pas venir</span>`;
  return `
  <div class="card done">
    <div class="big">${r.presence==='oui'?'🎉':'🙏'}</div>
    <h2>${r.presence==='oui'?'Merci, à bientôt !':'Merci pour votre réponse'}</h2>
    <div class="recap"><div><b>${esc(r.famille)}</b></div>${rec}</div>
    <p>${online?'Votre réponse a bien été <b>enregistrée</b>. Aucune autre démarche n\'est nécessaire.':(data.e?'Votre messagerie s\'est ouverte avec un email pré-rempli : <b>il ne vous reste qu\'à l\'envoyer</b>.':'<span style="color:var(--gold);">Aperçu : aucune base en ligne n\'est reliée à ce formulaire, la réponse n\'a pas été transmise.</span>')}</p>
    <p style="margin-top:10px;">Pour changer votre réponse, renvoyez le formulaire avec le même nom de famille : la nouvelle réponse remplace l'ancienne.</p>
    <p style="margin-top:14px;"><button class="link" onclick="renderApp(true)">Modifier ma réponse</button></p>
  </div>`;
}

function bindForm(){
  const out = document.getElementById('nombre');
  const maj = d => { nombre = Math.min(10, Math.max(1, nombre + d)); out.textContent = String(nombre); };
  document.getElementById('moins').onclick = () => maj(-1);
  document.getElementById('plus').onclick = () => maj(1);
  const majPres = () => { document.getElementById('fg-nombre').hidden = !document.getElementById('p-oui').checked; };
  document.getElementById('p-oui').onchange = majPres;
  document.getElementById('p-non').onchange = majPres;
  // Pré-remplissage si la famille a déjà répondu sur cet appareil
  let deja = null; try{ deja = JSON.parse(localStorage.getItem(STORE)); }catch(e){}
  if(deja && deja.famille){
    document.getElementById('famille').value = deja.famille;
    (document.getElementById(deja.presence==='non'?'p-non':'p-oui')).checked = true;
    nombre = 1; maj((parseInt(deja.nombre)||1)-1);
  }
  majPres();
}

function renderApp(forceForm){
  document.getElementById('h-titre').textContent = data.t || "Réunion d'information périscolaire maternelle";
  document.getElementById('h-sub').textContent = [data.d?cap(fmtDateLong(data.d)):'', data.h?('à '+data.h):'', data.l||''].filter(Boolean).join('  ·  ');
  if(isClosed()){ content.innerHTML = headerBlocks() + closedBlock(); return; }
  let deja = null; try{ deja = JSON.parse(localStorage.getItem(STORE)); }catch(e){}
  if(deja && deja.famille && !forceForm){ content.innerHTML = headerBlocks() + doneBlock(deja, true); return; }
  content.innerHTML = headerBlocks() + formBlock();
  bindForm();
}

// Au chargement : on lit la clôture en ligne si une base est branchée, pour que
// MÊME un lien déjà distribué respecte la fermeture décidée depuis ARIA.
async function initForm(){
  if(!data){
    content.innerHTML = '<div class="notice" style="margin-top:24px;">Ce lien d\'inscription est incomplet ou invalide. Merci de contacter le service périscolaire pour obtenir le bon lien.</div>';
    return;
  }
  if(data.b){
    content.innerHTML = '<div style="text-align:center;padding:40px;color:var(--t2);">Chargement…</div>';
    try {
      const sep = data.b.includes('?') ? '&' : '?';
      const r = await fetch(data.b + sep + 'action=reunion_config', { method:'GET' });
      const out = await r.json();
      if(out && out.ok){
        if(out.closeAt) liveCloseAt = out.closeAt;
        liveClosed = (out.closed === '1' || out.closed === 'true');
      }
    } catch(e){ /* en cas d'échec, on retombe sur la clôture du lien */ }
  }
  renderApp();
}
initForm();

async function submitForm(){
  const err = document.getElementById('err');
  const show = m => { err.textContent = m; err.style.display = 'block'; };
  err.style.display = 'none';
  if(isClosed()){ renderApp(); return; }

  const famille = document.getElementById('famille').value.replace(/\s+/g,' ').trim();
  if(famille.length < 2){ show('Merci d\'indiquer le nom de la famille.'); document.getElementById('famille').focus(); return; }
  const presence = document.getElementById('p-oui').checked ? 'oui' : 'non';
  const rec = {
    id: Date.now().toString(36)+Math.random().toString(36).slice(2,7),
    createdAt: new Date().toISOString(),
    famille, presence, nombre: presence==='oui' ? nombre : 0
  };

  // 1) Base en ligne : envoi direct (GET, comme les autres formulaires ARIA — le POST
  //    cross-origin vers Apps Script est mal accepté par les navigateurs).
  if(data.b && data.wk){
    const btn = document.getElementById('btn');
    btn.disabled = true; btn.textContent = '⏳ Envoi en cours...';
    try {
      const sep = data.b.includes('?') ? '&' : '?';
      const url = data.b + sep + 'action=reunion_save&wk=' + encodeURIComponent(data.wk)
        + '&closeAt=' + encodeURIComponent(liveCloseAt||'')
        + '&payload=' + encodeURIComponent(JSON.stringify(rec));
      const r = await fetch(url, { method:'GET' });
      const out = await r.json();
      if(out && out.error === 'closed'){ liveClosed = true; renderApp(); return; }
      if(!out || out.ok === false) throw new Error((out&&out.error)||'réponse invalide');
      try{ localStorage.setItem(STORE, JSON.stringify(rec)); }catch(e){}
      content.innerHTML = headerBlocks() + doneBlock(rec, true);
      window.scrollTo({top:0,behavior:'smooth'});
      return;
    } catch(e){
      btn.disabled = false; btn.textContent = '📨 Je m\'inscris';
      show('L\'envoi n\'a pas abouti. Vérifiez votre connexion puis réessayez.');
      return;
    }
  }

  // 2) Repli sans base en ligne : email pré-rempli à l'organisateur
  const body = [`RÉUNION MATERNELLE — ${data.t||''}`, `Famille : ${famille}`, `Présence : ${presence==='oui'?'oui':'non'}`, presence==='oui'?`Nombre de personnes : ${nombre}`:'' ].filter(Boolean).join('\n');
  if(data.e) window.location.href = `mailto:${data.e}?subject=${encodeURIComponent('Réunion maternelle — '+famille)}&body=${encodeURIComponent(body)}`;
  try{ localStorage.setItem(STORE, JSON.stringify(rec)); }catch(e){}
  content.innerHTML = headerBlocks() + doneBlock(rec, false);
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
</body>
</html>
