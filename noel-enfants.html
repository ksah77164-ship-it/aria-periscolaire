<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c2a1f">
<title>Noël des enfants — Inscription</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{ --bg:#0c2214; --bg2:#10301d; --card:#143a25; --card2:#17442b; --line:rgba(61,220,132,0.22); --line2:rgba(61,220,132,0.45);
  --green:#3ddc84; --green2:#8af0b2; --red:#ff5a5a; --red2:#ff9b9b; --gold:#ffd36b; --text:#eafff2; --t2:#bfe8cf; --t3:#7fb295; }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Outfit',sans-serif;color:var(--text);background:
  radial-gradient(1000px 500px at 50% -8%,#12452a 0%,var(--bg) 60%) fixed;min-height:100vh;
  padding:18px 14px calc(30px + env(safe-area-inset-bottom));}
.wrap{max-width:560px;margin:0 auto;}
.hero{background:linear-gradient(135deg,#0f3d26,#1b6b40);border-radius:22px;padding:26px 20px;text-align:center;
  box-shadow:0 14px 40px rgba(27,107,64,0.4);position:relative;overflow:hidden;margin-bottom:18px;}
.hero::after{content:"🎄🎁⛄❄️";position:absolute;inset:0;font-size:30px;opacity:.12;letter-spacing:22px;line-height:2.6;}
.hero .pre{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--gold);}
.hero h1{font-size:25px;font-weight:800;margin:8px 0 6px;line-height:1.15;}
.hero .sub{font-size:14px;color:#dff7e8;font-weight:600;}
.hero .when{display:inline-block;margin-top:12px;background:rgba(255,211,107,0.16);border:1px solid rgba(255,211,107,0.4);
  border-radius:20px;padding:6px 15px;font-size:13px;font-weight:800;color:var(--gold);}
.section-title{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--green2);margin:18px 0 10px;}
.note{background:rgba(61,220,132,0.08);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:13px;
  color:var(--t2);font-weight:600;line-height:1.55;margin-bottom:14px;}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
@media(max-width:420px){.slots{grid-template-columns:1fr;}}
.slot{background:linear-gradient(160deg,var(--card2),var(--card));border:1.5px solid var(--line);border-radius:14px;
  padding:13px;cursor:pointer;transition:.12s;text-align:left;}
.slot:active{transform:scale(.99);}
.slot.sel{border-color:var(--green);box-shadow:0 0 0 2px rgba(61,220,132,0.35);background:linear-gradient(160deg,#1c5536,#17442b);}
.slot.full{opacity:.5;cursor:not-allowed;filter:grayscale(.4);}
.slot-h{font-size:16px;font-weight:800;color:var(--text);}
.slot-places{font-size:12px;font-weight:700;margin-top:4px;}
.slot-places.ok{color:var(--green);} .slot-places.low{color:var(--gold);} .slot-places.full{color:var(--red);}
.slot-bar{height:6px;border-radius:4px;background:rgba(255,255,255,0.08);margin-top:8px;overflow:hidden;}
.slot-bar>div{height:100%;background:linear-gradient(90deg,var(--green),var(--green2));}
.pane{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:14px;
  padding:13px;margin-bottom:12px;}
.child-card{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:14px;
  padding:13px;margin-bottom:10px;}
.child-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;}
.ct{font-size:14px;font-weight:800;color:var(--green2);}
.child-rm{background:rgba(255,90,90,0.12);border:1px solid rgba(255,90,90,0.4);color:var(--red);border-radius:18px;
  padding:4px 11px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.row{display:flex;gap:9px;flex-wrap:wrap;}
.fg{flex:1;min-width:120px;margin-bottom:9px;}
.fg.full{flex-basis:100%;}
.fg label{display:block;font-size:11px;font-weight:700;color:var(--t3);margin-bottom:4px;}
.fg input,.fg select{width:100%;background:var(--bg2);border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;
  font-size:15px;font-family:inherit;font-weight:600;color:var(--text);color-scheme:dark;}
.fg input:focus,.fg select:focus{outline:none;border-color:var(--green);}
.add-child{width:100%;background:transparent;border:1.5px dashed var(--line2);color:var(--green2);border-radius:12px;
  padding:11px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:14px;}
.submit{width:100%;background:linear-gradient(135deg,var(--green),var(--green2));color:#06351d;border:none;border-radius:14px;
  padding:15px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 8px 24px rgba(61,220,132,0.3);margin-top:4px;}
.submit:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;}
.err{display:none;background:rgba(255,90,90,0.12);border:1px solid rgba(255,90,90,0.4);color:#ffb3b3;border-radius:12px;
  padding:11px 13px;font-size:13px;font-weight:700;margin:12px 0;line-height:1.5;}
.ok-box{background:linear-gradient(160deg,rgba(61,220,132,0.14),rgba(61,220,132,0.06));border:1px solid rgba(61,220,132,0.45);
  border-radius:16px;padding:22px 18px;text-align:center;}
.ok-box .big{font-size:40px;}
.ok-box h2{font-size:19px;font-weight:800;margin:8px 0 6px;color:var(--green);}
.ok-box p{font-size:14px;color:var(--t2);font-weight:600;line-height:1.6;}
.ok-box .cr{display:inline-block;margin-top:10px;background:rgba(255,211,107,0.16);border:1px solid rgba(255,211,107,0.4);
  border-radius:20px;padding:7px 16px;font-size:15px;font-weight:800;color:var(--gold);}
.again{margin-top:16px;background:var(--bg2);border:1px solid var(--line);color:var(--t2);border-radius:12px;padding:11px 16px;
  font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.loading{text-align:center;color:var(--t3);font-weight:700;padding:30px 0;}
footer{text-align:center;color:var(--t3);font-size:11px;margin-top:22px;font-weight:600;}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">Chargement… 🎄</div></div>

<script>
// ── Configuration (créneaux figés) ───────────────────────────────────────────
const NX_TITRE = "Noël des enfants";
const NX_SOUS  = "Fête de Noël organisée par la commune";
const NX_DATE  = "Samedi 5 décembre 2026";
const NX_CAP   = 12; // enfants par créneau
const NX_SLOTS = [
  {i:'c1', l:'9h30 – 9h45'},{i:'c2', l:'9h45 – 10h00'},{i:'c3', l:'10h00 – 10h15'},{i:'c4', l:'10h15 – 10h30'},
  {i:'c5', l:'10h30 – 10h45'},{i:'c6', l:'10h45 – 11h00'},{i:'c7', l:'11h00 – 11h15'},{i:'c8', l:'11h15 – 11h30'},
  {i:'c9', l:'11h30 – 11h45'},{i:'c10', l:'11h45 – 12h00'},{i:'c11', l:'12h00 – 12h15'},{i:'c12', l:'12h15 – 12h30'},
  {i:'c13', l:'14h00 – 14h15'},{i:'c14', l:'14h15 – 14h30'},{i:'c15', l:'14h30 – 14h45'},{i:'c16', l:'14h45 – 15h00'},
  {i:'c17', l:'15h00 – 15h15'},{i:'c18', l:'15h15 – 15h30'},{i:'c19', l:'15h30 – 15h45'},{i:'c20', l:'15h45 – 16h00'},
  {i:'c21', l:'16h00 – 16h15'},{i:'c22', l:'16h15 – 16h30'},{i:'c23', l:'16h30 – 16h45'},{i:'c24', l:'16h45 – 17h00'},
  {i:'c25', l:'17h00 – 17h15'}
];
// Fenêtre d'inscription (heure locale). Laisser NX_OPEN_AT vide = ouvert tout de suite.
const NX_OPEN_AT  = '';
const NX_CLOSE_AT = '2026-12-04T20:00';
function nxParse(s){ if(!s) return null; const d=new Date(s); return isNaN(d.getTime())?null:d; }
function isBeforeOpen(){ const d=nxParse(NX_OPEN_AT); return !!d && Date.now() < d.getTime(); }
function isAfterClose(){ const d=nxParse(NX_CLOSE_AT); return !!d && Date.now() >= d.getTime(); }
function fmtDT(s){ const d=nxParse(s); if(!d) return ''; return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})+' à '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }

// ── Lecture du lien (base en ligne) ──────────────────────────────────────────
function decodePayload(){
  const p = new URLSearchParams(location.search).get('d');
  if(!p) return null;
  try{ const b64 = p.replace(/-/g,'+').replace(/_/g,'/'); return JSON.parse(decodeURIComponent(escape(atob(b64)))); }
  catch(e){ return null; }
}
const data = decodePayload() || {};
const BACKEND = (data.b||'').trim();   // URL Apps Script (…/exec)
const WKEY    = (data.wk||'').trim();  // clé d'écriture
const app = document.getElementById('app');
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

let counts = {};      // { c1: 3, ... } nombre d'enfants déjà inscrits par créneau
let selected = null;  // id du créneau choisi
let childCount = 0;
let savedParent = { email:'', tel:'' };

// ── Comptage en ligne ────────────────────────────────────────────────────────
async function loadCounts(){
  if(!BACKEND){ return false; }
  try{
    const sep = BACKEND.includes('?') ? '&' : '?';
    const r = await fetch(BACKEND + sep + 'action=nx_count&t=' + Date.now());
    const out = await r.json();
    if(out && out.ok){ counts = out.counts || {}; return true; }
  }catch(e){}
  return false;
}
function remaining(id){ return Math.max(0, NX_CAP - (counts[id]||0)); }
const NX_TOTAL = NX_SLOTS.length * NX_CAP;
function allFull(){ return NX_SLOTS.reduce((a,s)=>a+remaining(s.i),0) <= 0; }

// ── Rendu ────────────────────────────────────────────────────────────────────
function hero(){
  return `<div class="hero">
    <div class="pre">🎄 Inscription en ligne</div>
    <h1>${esc(NX_TITRE)}</h1>
    <div class="sub">${esc(NX_SOUS)}</div>
    <div class="when">📅 ${esc(NX_DATE)} · 9h30 → 17h00</div>
  </div>`;
}
function slotsHtml(){
  const wl = allFull();
  const intro = wl
    ? `<div class="section-title">1. Choisissez un créneau (liste d'attente)</div>
       <div class="note" style="border-color:var(--line2);background:rgba(255,211,107,0.12);"><b>⏳ Tous les créneaux sont complets.</b> Vous pouvez vous inscrire sur la <b>liste d'attente</b> : choisissez le créneau que vous préféreriez, puis inscrivez votre/vos enfant(s). Nous vous préviendrons si une place se libère.</div>`
    : `<div class="section-title">1. Choisissez un créneau</div>
       <div class="note">Chaque créneau accueille <b>${NX_CAP} enfants maximum</b>. Dès qu'un créneau est complet, il n'est plus disponible. Choisissez une heure, puis inscrivez votre/vos enfant(s). <br>🍽️ Pause de 12h30 à 14h00. <br>⏰ Inscriptions ouvertes jusqu'au <b>vendredi 4 décembre, 20h</b>.</div>`;
  return intro + `<div class="slots">` + NX_SLOTS.map(s=>{
    const rem = remaining(s.i), full = rem<=0;
    const cls = full?'full':(rem<=3?'low':'ok');
    const txt = full ? (wl?"Complet · liste d'attente":'COMPLET') : (rem+' place'+(rem>1?'s':'')+' restante'+(rem>1?'s':''));
    const pct = Math.round(((NX_CAP-rem)/NX_CAP)*100);
    const selectable = wl || !full;
    return `<div class="slot ${(full&&!wl)?'full':''} ${selected===s.i?'sel':''}" ${selectable?`onclick="selectSlot('${s.i}')"`:''}>
      <div class="slot-h">${s.l}</div>
      <div class="slot-places ${wl?'low':cls}">${(full&&!wl)?'🚫 ':(full&&wl?'⏳ ':'')}${txt}</div>
      <div class="slot-bar"><div style="width:${pct}%;"></div></div>
    </div>`;
  }).join('') + `</div>`;
}
function parentHtml(){
  return `<div class="section-title">2. Vos coordonnées (parent)</div>
    <div class="pane">
      <div class="row">
        <div class="fg full"><label>Adresse e-mail *</label><input id="p-email" type="email" inputmode="email" autocomplete="email" value="${esc(savedParent.email)}" placeholder="exemple@mail.com"/></div>
        <div class="fg full"><label>Numéro de téléphone *</label><input id="p-tel" type="tel" inputmode="tel" autocomplete="tel" value="${esc(savedParent.tel)}" placeholder="06 12 34 56 78"/></div>
      </div>
    </div>`;
}
function childCardHtml(n){
  return `<div class="child-card" data-child="${n}">
    <div class="child-head"><span class="ct">🧒 Enfant ${n}</span>
      ${n>1?`<button type="button" class="child-rm" onclick="removeChild(${n})">✕ Retirer</button>`:''}</div>
    <div class="row">
      <div class="fg"><label>Prénom *</label><input class="c-prenom" autocomplete="off"/></div>
      <div class="fg"><label>Nom *</label><input class="c-nom" autocomplete="off"/></div>
      <div class="fg full"><label>Date de naissance *</label><input class="c-ddn" type="date" max="2026-12-05"/></div>
    </div>
  </div>`;
}
function formHtml(){
  const wl = allFull();
  return parentHtml() + `<div class="section-title">3. Inscrivez votre/vos enfant(s)</div>
    <div id="children"></div>
    <button type="button" class="add-child" onclick="addChild()">➕ Ajouter un autre enfant</button>
    <div class="err" id="err"></div>
    <button class="submit" id="submitBtn" onclick="submitForm()">${wl?"⏳ M'inscrire sur la liste d'attente":"🎄 Valider l'inscription"}</button>`;
}
let cdTimer=null;
function lockHtml(){
  return `<div class="ok-box" style="border-color:var(--line2);background:linear-gradient(160deg,rgba(255,211,107,0.12),rgba(61,220,132,0.06));">
    <div class="big">🔒🎄</div>
    <h2 style="color:var(--gold);">Les inscriptions ne sont pas encore ouvertes</h2>
    <p>Ouverture le <b>${esc(fmtDT(NX_OPEN_AT))}</b>.</p>
    <div id="cd" style="margin:16px auto 0;max-width:280px;background:#06230f;border:1px solid var(--line2);border-radius:12px;padding:13px;font-family:'DM Mono',monospace;font-size:23px;font-weight:700;color:var(--gold);letter-spacing:.5px;">—</div>
    <p style="margin-top:14px;">Gardez ce lien : le formulaire <b>s'ouvrira tout seul</b> à cette date.</p>
  </div><footer>Mairie de Ferrières-en-Brie</footer>`;
}
function closedHtml(){
  return `<div class="ok-box" style="border-color:rgba(255,90,90,0.4);background:rgba(255,90,90,0.08);">
    <div class="big">🏁🎄</div>
    <h2 style="color:var(--red);">Les inscriptions sont terminées</h2>
    <p>Pour toute question, contactez la mairie.</p>
  </div><footer>Mairie de Ferrières-en-Brie</footer>`;
}
function startCountdown(){
  if(cdTimer){ clearInterval(cdTimer); }
  const open=nxParse(NX_OPEN_AT); if(!open){ return; }
  const tick=()=>{
    const el=document.getElementById('cd'); if(!el){ clearInterval(cdTimer); cdTimer=null; return; }
    let diff=Math.floor((open.getTime()-Date.now())/1000);
    if(diff<=0){ clearInterval(cdTimer); cdTimer=null; loadCounts().then(render); return; }
    const d=Math.floor(diff/86400); diff-=d*86400; const h=Math.floor(diff/3600); diff-=h*3600; const m=Math.floor(diff/60); const s=diff-m*60;
    el.textContent=(d>0?d+'j ':'')+String(h).padStart(2,'0')+'h '+String(m).padStart(2,'0')+'m '+String(s).padStart(2,'0')+'s';
  };
  tick(); cdTimer=setInterval(tick,1000);
}
function render(){
  if(isBeforeOpen()){ app.innerHTML = hero() + lockHtml(); startCountdown(); return; }
  if(cdTimer){ clearInterval(cdTimer); cdTimer=null; }
  if(isAfterClose()){ app.innerHTML = hero() + closedHtml(); return; }
  app.innerHTML = hero() + slotsHtml() + (selected ? formHtml() : '') +
    `<footer>Mairie de Ferrières-en-Brie · Les données ne servent qu'à l'organisation de la fête.</footer>`;
  if(selected && !document.querySelector('#children .child-card')){ childCount=0; addChild(); }
}
function selectSlot(id){ if(!allFull() && remaining(id)<=0) return; captureParent(); selected=id; render(); setTimeout(()=>{ const c=document.querySelector('#children .c-prenom'); if(c) c.focus(); },60); }
function captureParent(){ const e=document.getElementById('p-email'), t=document.getElementById('p-tel'); if(e) savedParent.email=e.value.trim(); if(t) savedParent.tel=t.value.trim(); }
function addChild(){ const c=document.getElementById('children'); if(!c) return; c.insertAdjacentHTML('beforeend', childCardHtml(++childCount)); }
function removeChild(n){ const el=document.querySelector(`.child-card[data-child="${n}"]`); if(el) el.remove(); renumber(); }
function renumber(){ document.querySelectorAll('#children .child-card').forEach((card,i)=>{ card.querySelector('.ct').textContent='🧒 Enfant '+(i+1); const rm=card.querySelector('.child-rm'); if(rm) rm.style.display = i===0?'none':''; }); }

function collectParent(show){
  const email=(document.getElementById('p-email')||{}).value, tel=(document.getElementById('p-tel')||{}).value;
  const e=(email||'').trim(), t=(tel||'').trim();
  if(!e || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)){ show('Merci d\'indiquer une adresse e-mail valide (pour vous contacter).'); return null; }
  if(!t || t.replace(/[^0-9]/g,'').length < 8){ show('Merci d\'indiquer un numéro de téléphone valide.'); return null; }
  savedParent={email:e, tel:t};
  return savedParent;
}
function collectChildren(show){
  const cards=[...document.querySelectorAll('#children .child-card')]; const kids=[];
  for(let i=0;i<cards.length;i++){
    const g=s=>{ const e=cards[i].querySelector(s); return e?e.value.trim():''; };
    const prenom=g('.c-prenom'), nom=g('.c-nom'), ddn=g('.c-ddn');
    if(!prenom||!nom){ show(`Enfant ${i+1} : merci d'indiquer le prénom et le nom.`); return null; }
    if(!ddn){ show(`Enfant ${i+1} : merci d'indiquer la date de naissance.`); return null; }
    kids.push({prenom, nom, ddn});
  }
  if(!kids.length){ show('Merci d\'ajouter au moins un enfant.'); return null; }
  return kids;
}

async function submitForm(){
  const err=document.getElementById('err');
  const show=m=>{ err.textContent=m; err.style.display='block'; err.scrollIntoView({behavior:'smooth',block:'center'}); };
  err.style.display='none';
  if(!selected){ show('Choisissez d\'abord un créneau.'); return; }
  const parent=collectParent(show); if(!parent) return;
  const kids=collectChildren(show); if(!kids) return;
  const slot=NX_SLOTS.find(s=>s.i===selected);
  const btn=document.getElementById('submitBtn'); btn.disabled=true; btn.textContent='Enregistrement…';
  await loadCounts();
  const wl = allFull();
  if(!wl && remaining(selected) < kids.length){
    btn.disabled=false; btn.textContent='🎄 Valider l\'inscription';
    const rem=remaining(selected);
    render();
    show(rem<=0 ? `Désolé, le créneau ${slot.l} vient d'être complet. Choisissez-en un autre.` :
         `Il ne reste que ${rem} place${rem>1?'s':''} sur le créneau ${slot.l}. Réduisez le nombre d'enfants ou changez de créneau.`);
    return;
  }
  if(!BACKEND||!WKEY){ btn.disabled=false; btn.textContent='🎄 Valider l\'inscription'; show('Inscription en ligne non disponible (base non configurée). Contactez la mairie.'); return; }
  const payload={ creneau:selected, creneauLabel:slot.l, cap:NX_CAP, totalCap:NX_TOTAL, createdAt:new Date().toISOString(), email:parent.email, tel:parent.tel, enfants:kids };
  try{
    const sep=BACKEND.includes('?')?'&':'?';
    const r=await fetch(BACKEND+sep+'action=nx_save&wk='+encodeURIComponent(WKEY)+'&payload='+encodeURIComponent(JSON.stringify(payload)));
    const out=await r.json();
    if(out && out.ok){ showSuccess(slot, kids, out); return; }
    if(out && out.full){ if(typeof out.count==='number') counts[selected]=out.count; render(); const rem=remaining(selected);
      show(rem<=0?`Désolé, le créneau ${slot.l} est complet. Choisissez-en un autre.`:`Il ne reste que ${rem} place${rem>1?'s':''} sur ${slot.l}.`);
    } else if(out && out.dup){
      const noms=(out.noms&&out.noms.length)?out.noms.join(', '):'cet enfant';
      show(`⚠️ Déjà inscrit : ${noms}. Chaque enfant ne peut être inscrit qu'une seule fois. Si vous pensez qu'il y a une erreur, contactez la mairie.`);
    } else { show('Enregistrement impossible : '+((out&&out.error)||'réessayez dans un instant.')); }
  }catch(e){ show('Problème de connexion. Vérifiez votre réseau et réessayez.'); }
  btn.disabled=false; btn.textContent='🎄 Valider l\'inscription';
}

function showSuccess(slot, kids, out){
  const wl = !!(out && out.waitlist);
  if(!wl && out && typeof out.count==='number') counts[slot.i]=out.count;
  const noms = kids.map(k=>esc(k.prenom+' '+k.nom)).join(', ');
  app.innerHTML = hero() + `<div class="ok-box"${wl?' style="border-color:var(--line2);background:linear-gradient(160deg,rgba(255,211,107,0.14),rgba(61,220,132,0.05));"':''}>
    <div class="big">${wl?'⏳🎄':'🎄🎁'}</div>
    <h2${wl?' style="color:var(--gold);"':''}>${wl?"Inscription en liste d'attente":'Inscription confirmée !'}</h2>
    <p>${kids.length>1?(wl?'Vos enfants sont en liste d\'attente':'Vos enfants sont inscrits'):(wl?'Votre enfant est en liste d\'attente':'Votre enfant est inscrit')} :<br><b>${noms}</b></p>
    <div class="cr">🕐 Créneau ${esc(slot.l)}${wl?' (souhaité)':''}</div>
    <p style="margin-top:14px;">${wl?'Tous les créneaux sont complets pour le moment. <b>Nous vous préviendrons</b> si une place se libère.':'Rendez-vous le <b>'+esc(NX_DATE)+'</b> à votre créneau. Joyeux Noël ! 🎅'}</p>
    <button class="again" onclick="resetForm()">➕ Inscrire un autre enfant</button>
  </div>` + `<footer>Mairie de Ferrières-en-Brie</footer>`;
}
function resetForm(){ selected=null; childCount=0; loadCounts().then(render); }

// ── Démarrage ────────────────────────────────────────────────────────────────
(async function(){
  await loadCounts();
  render();
})();
</script>
</body>
</html>
