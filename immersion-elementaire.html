<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Inscription — Immersion au centre de loisirs</title>
<style>
  :root{
    --bg:#050508;--s1:#0a0a10;--s2:#0f0f18;--s3:#151520;--s4:#1a1a28;
    --ac:#6c63ff;--ac2:#8b85ff;--ac3:#b0acff;
    --cyan:#00d4ff;--green:#00ff88;--rose:#ff6b9d;--gold:#f2a516;
    --border:rgba(108,99,255,0.18);--border2:rgba(108,99,255,0.32);
    --text:#f0eeff;--t2:#a8a2d6;--t3:#6b6790;--r:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:system-ui,'Segoe UI',sans-serif;background:radial-gradient(1200px 600px at 50% -10%,rgba(108,99,255,0.18),transparent),var(--bg);color:var(--text);line-height:1.55;min-height:100vh;padding:0 0 60px;}
  .wrap{max-width:620px;margin:0 auto;padding:0 18px;}
  header.hero{background:linear-gradient(135deg,#0f6e56,#1fb28a);padding:30px 18px 26px;text-align:center;border-radius:0 0 28px 28px;box-shadow:0 10px 40px rgba(31,178,138,0.25);}
  .hero .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;background:rgba(255,255,255,0.18);color:#fff;padding:5px 14px;border-radius:20px;margin-bottom:12px;}
  .hero h1{font-size:24px;color:#fff;line-height:1.2;text-wrap:balance;}
  .hero .sub{color:rgba(255,255,255,0.9);font-size:14px;margin-top:8px;}
  .infos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px;}
  .info{background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;}
  .info .k{font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--t3);font-weight:700;}
  .info .v{font-size:15px;font-weight:700;color:var(--text);margin-top:2px;font-variant-numeric:tabular-nums;}
  .info .v small{display:block;font-size:11px;font-weight:600;color:var(--t2);}
  @media (max-width:460px){ .infos{grid-template-columns:1fr;} }
  .explain{background:rgba(31,178,138,0.08);border:1px solid rgba(31,178,138,0.3);border-radius:var(--r);padding:14px 16px;font-size:13px;color:var(--t2);margin-top:14px;line-height:1.6;}
  .explain b{color:var(--text);}
  .section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--ac3);margin:24px 0 12px;}
  form,.card{background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-top:14px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row .fg{flex:1;min-width:160px;}
  .fg{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
  label.lbl,.lbl{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--t3);font-weight:700;}
  input[type=text]{background:var(--s1);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:12px 12px;font-size:16px;font-family:inherit;width:100%;}
  input[type=text]:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(108,99,255,0.2);}
  .hint{font-size:12px;color:var(--t3);}
  .choix{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .choix label{position:relative;display:flex;flex-direction:column;gap:2px;padding:14px 14px 14px 42px;cursor:pointer;border:1px solid var(--border2);border-radius:12px;background:var(--s1);font-weight:700;font-size:16px;color:var(--text);}
  .choix label span{font-weight:500;font-size:12px;color:var(--t2);}
  .choix input{position:absolute;left:14px;top:18px;width:18px;height:18px;margin:0;accent-color:var(--ac);}
  .choix label:has(input:checked){border-color:var(--ac);background:rgba(108,99,255,0.14);box-shadow:0 0 0 3px rgba(108,99,255,0.15);}
  @media (max-width:460px){ .choix{grid-template-columns:1fr;} }
  .err{display:none;background:rgba(255,107,157,0.12);border:1px solid rgba(255,107,157,0.4);color:var(--rose);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px;}
  button.submit{width:100%;background:linear-gradient(135deg,#3a2bcc,var(--ac));border:none;color:#fff;padding:15px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 6px 24px rgba(108,99,255,0.35);font-family:inherit;}
  button.submit:hover{filter:brightness(1.08);}
  button.submit:disabled{opacity:0.6;cursor:wait;}
  .notice{background:rgba(242,165,22,0.12);border:1px solid rgba(242,165,22,0.4);color:#ffd98a;border-radius:var(--r);padding:12px 16px;font-size:13px;margin-top:16px;}
  .done,.closed{text-align:center;padding:28px 18px;}
  .done .big,.closed .big{font-size:44px;line-height:1;margin-bottom:10px;}
  .done h2,.closed h2{font-size:22px;color:#fff;margin-bottom:8px;}
  .done p,.closed p{color:var(--t2);font-size:14px;}
  .recap{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin:16px 0;text-align:left;font-size:15px;}
  .recap b{color:#fff;}
  .link{background:none;border:none;color:var(--ac3);font-size:14px;font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-family:inherit;}
  .foot{text-align:center;font-size:12px;color:var(--t3);margin-top:24px;}
</style>
</head>
<body>
<header class="hero">
  <div class="tag">École élémentaire · note aux parents</div>
  <h1 id="h-titre">Immersion au centre de loisirs</h1>
  <div class="sub" id="h-sub"></div>
</header>
<div class="wrap" id="content"></div>

<script>
// ── Lecture de la configuration encodée dans le lien (généré par ARIA) ──
function decodePayload(){
  const p = new URLSearchParams(location.search).get('d');
  if(!p) return null;
  try { const b64 = p.replace(/-/g,'+').replace(/_/g,'/'); return JSON.parse(decodeURIComponent(escape(atob(b64)))); }
  catch(e){ return null; }
}
// Deux formes de lien : ?d=... (tout est dans le lien) ou ?b=...&wk=... (lien court : la page lit l'événement dans la base)
const data = decodePayload() || (function(){ const q = new URLSearchParams(location.search); return q.get('b') ? { b: q.get('b'), wk: q.get('wk')||'' } : null; })();
const esc = s => (''+(s==null?'':s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const content = document.getElementById('content');
let liveCloseAt = data && data.c ? data.c : '';
let liveClosed = false;
const STORE = 'aria-immersion-reponse';
const CRENEAUX = { 'matin-repas': 'Matin avec repas', matin: 'Matin sans repas', 'apres-midi': 'Après-midi' };

function fmtDateLong(d){ try{ return new Date(d+'T00:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}); }catch(e){ return d||''; } }
function fmtDateShort(d){ try{ return new Date(d+'T00:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'short'}); }catch(e){ return d||''; } }
function fmtCloture(iso){
  if(!iso) return '';
  try{ const d=new Date(iso); const tz={timeZone:'Europe/Paris'}; return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',...tz})+' à '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',...tz}).replace(':','h'); }catch(e){ return iso; }
}
function isClosed(){
  if(liveClosed) return true;
  if(!liveCloseAt) return false;
  const t = Date.parse(liveCloseAt);
  return !isNaN(t) && Date.now() >= t;
}
function cap(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }
function creneauLabel(k){ const h = k==='apres-midi' ? data.a : data.m; return (CRENEAUX[k]||k) + (h ? ' ('+h+')' : ''); }

function headerBlocks(){
  const dateTxt = data.d ? cap(fmtDateShort(data.d)) : '';
  const clot = liveCloseAt ? cap(fmtCloture(liveCloseAt)) : '';
  return `
  <div class="infos">
    <div class="info"><div class="k">Date</div><div class="v">${esc(dateTxt||'—')}</div></div>
    <div class="info"><div class="k">Créneaux</div><div class="v">Matin (avec ou sans repas) ou après-midi${(data.m||data.a)?`<small>${esc([data.m?'Matin : '+data.m:'', data.a?'Après-midi : '+data.a:''].filter(Boolean).join(' · '))}</small>`:''}${data.l?`<small>${esc(data.l)}</small>`:''}</div></div>
    <div class="info"><div class="k">Inscriptions</div><div class="v">${clot?`jusqu'au<small>${esc(clot)}</small>`:'ouvertes'}</div></div>
  </div>
  <div class="explain">${data.i ? esc(data.i).replace(/\n/g,'<br>') : 'Venez passer une <b>demi-journée au centre de loisirs</b> avec les enfants et l\'équipe d\'animation, pour voir de l\'intérieur comment se déroulent les accueils et les activités. Choisissez le créneau qui vous convient : le matin, avec ou sans le repas du midi, ou l\'après-midi.'}</div>`;
}

function formBlock(){
  return `
  <div class="section-title">Votre inscription</div>
  <form id="form" onsubmit="return false;">
    <div class="row">
      <div class="fg"><label class="lbl" for="nom">Nom du parent *</label><input type="text" id="nom" maxlength="60" autocomplete="family-name" placeholder="Ex. : Dupont"/></div>
      <div class="fg"><label class="lbl" for="prenom">Prénom *</label><input type="text" id="prenom" maxlength="60" autocomplete="given-name" placeholder="Ex. : Marie"/></div>
    </div>
    <div class="fg">
      <div class="lbl">Je viens *</div>
      <div class="choix">
        <label><input type="radio" name="creneau" id="c-matin-repas" value="matin-repas" checked/>Le matin, avec le repas<span>${esc(data.m||'Demi-journée du matin')} · je déjeune avec les enfants</span></label>
        <label><input type="radio" name="creneau" id="c-matin" value="matin"/>Le matin, sans le repas<span>${esc(data.m||'Demi-journée du matin')} · je repars avant le déjeuner</span></label>
        <label><input type="radio" name="creneau" id="c-am" value="apres-midi"/>L'après-midi<span>${esc(data.a||'Demi-journée de l\'après-midi')}</span></label>
      </div>
    </div>
    <div class="err" id="err"></div>
    <button class="submit" id="btn" onclick="submitForm()">📨 Je m'inscris</button>
  </form>
  <div class="foot">Seuls votre nom, votre prénom et le créneau choisi sont enregistrés. Une seule inscription par parent : renvoyer le formulaire remplace la précédente.</div>`;
}

function closedBlock(){
  return `
  <div class="card closed">
    <div class="big">🔒</div>
    <h2>Les inscriptions sont terminées</h2>
    <p>${liveCloseAt?`Elles se sont clôturées le ${esc(fmtCloture(liveCloseAt))}.`:'Elles ont été fermées par l\'organisateur.'} Pour toute question, contactez le service périscolaire.</p>
  </div>`;
}

function doneBlock(r, online){
  return `
  <div class="card done">
    <div class="big">🎉</div>
    <h2>Merci, à ${data.d?esc(fmtDateLong(data.d).split(' ')[0]):'bientôt'} !</h2>
    <div class="recap"><div><b>${esc(r.prenom)} ${esc(r.nom)}</b></div><span>Immersion <b>${esc(creneauLabel(r.creneau))}</b>${data.d?' · '+esc(cap(fmtDateLong(data.d))):''}</span></div>
    <p>${online?'Votre inscription a bien été <b>enregistrée</b>. Aucune autre démarche n\'est nécessaire.':(data.e?'Votre messagerie s\'est ouverte avec un email pré-rempli : <b>il ne vous reste qu\'à l\'envoyer</b>.':'<span style="color:var(--gold);">Aperçu : aucune base en ligne n\'est reliée à ce formulaire, l\'inscription n\'a pas été transmise.</span>')}</p>
    <p style="margin-top:10px;">Pour changer de créneau, renvoyez le formulaire avec les mêmes nom et prénom : la nouvelle inscription remplace l'ancienne.</p>
    <p style="margin-top:14px;"><button class="link" onclick="renderApp(true)">Modifier mon inscription</button></p>
  </div>`;
}

function bindForm(){
  let deja = null; try{ deja = JSON.parse(localStorage.getItem(STORE)); }catch(e){}
  if(deja && deja.nom){
    document.getElementById('nom').value = deja.nom;
    document.getElementById('prenom').value = deja.prenom||'';
    const ids = { 'matin-repas':'c-matin-repas', matin:'c-matin', 'apres-midi':'c-am' };
    (document.getElementById(ids[deja.creneau]) || document.getElementById('c-matin-repas')).checked = true;
  }
}

function renderApp(forceForm){
  document.getElementById('h-titre').textContent = data.t || 'Immersion au centre de loisirs';
  document.getElementById('h-sub').textContent = [data.d?cap(fmtDateLong(data.d)):'', 'une demi-journée, matin (avec ou sans repas) ou après-midi', data.l||''].filter(Boolean).join('  ·  ');
  if(isClosed()){ content.innerHTML = headerBlocks() + closedBlock(); return; }
  let deja = null; try{ deja = JSON.parse(localStorage.getItem(STORE)); }catch(e){}
  if(deja && deja.nom && !forceForm){ content.innerHTML = headerBlocks() + doneBlock(deja, true); return; }
  content.innerHTML = headerBlocks() + formBlock();
  bindForm();
}

async function initForm(){
  if(!data){
    content.innerHTML = '<div class="notice" style="margin-top:24px;">Ce lien d\'inscription est incomplet ou invalide. Merci de contacter le service périscolaire pour obtenir le bon lien.</div>';
    return;
  }
  if(data.b){
    content.innerHTML = '<div style="text-align:center;padding:40px;color:var(--t2);">Chargement…</div>';
    try {
      const sep = data.b.includes('?') ? '&' : '?';
      const r = await fetch(data.b + sep + 'action=immersion_config', { method:'GET' });
      const out = await r.json();
      if(out && out.ok){
        if(out.closeAt) liveCloseAt = out.closeAt;
        liveClosed = (out.closed === '1' || out.closed === 'true');
        ['t','d','l','m','a','i','e'].forEach(k => { if(out[k] && !data[k]) data[k] = out[k]; });
      }
    } catch(e){ /* en cas d'échec, on retombe sur la clôture du lien */ }
  }
  if(!data.t && !data.d){
    content.innerHTML = '<div class="notice" style="margin-top:24px;">Impossible de charger les informations de l\'immersion. Réessayez dans un instant ou contactez le service périscolaire.</div>';
    return;
  }
  renderApp();
}
initForm();

async function submitForm(){
  const err = document.getElementById('err');
  const show = m => { err.textContent = m; err.style.display = 'block'; };
  err.style.display = 'none';
  if(isClosed()){ renderApp(); return; }

  const clean = v => v.replace(/\s+/g,' ').trim();
  const nom = clean(document.getElementById('nom').value), prenom = clean(document.getElementById('prenom').value);
  if(nom.length < 2){ show('Merci d\'indiquer votre nom.'); document.getElementById('nom').focus(); return; }
  if(prenom.length < 2){ show('Merci d\'indiquer votre prénom.'); document.getElementById('prenom').focus(); return; }
  const creneau = document.getElementById('c-am').checked ? 'apres-midi' : (document.getElementById('c-matin').checked ? 'matin' : 'matin-repas');
  const rec = { id: Date.now().toString(36)+Math.random().toString(36).slice(2,7), createdAt: new Date().toISOString(), nom, prenom, creneau };

  if(data.b && data.wk){
    const btn = document.getElementById('btn');
    btn.disabled = true; btn.textContent = '⏳ Envoi en cours...';
    try {
      const sep = data.b.includes('?') ? '&' : '?';
      const url = data.b + sep + 'action=immersion_save&wk=' + encodeURIComponent(data.wk)
        + '&closeAt=' + encodeURIComponent(liveCloseAt||'')
        + '&payload=' + encodeURIComponent(JSON.stringify(rec));
      const r = await fetch(url, { method:'GET' });
      const out = await r.json();
      if(out && out.error === 'closed'){ liveClosed = true; renderApp(); return; }
      if(!out || out.ok === false) throw new Error((out&&out.error)||'réponse invalide');
      try{ localStorage.setItem(STORE, JSON.stringify(rec)); }catch(e){}
      content.innerHTML = headerBlocks() + doneBlock(rec, true);
      window.scrollTo({top:0,behavior:'smooth'});
      return;
    } catch(e){
      btn.disabled = false; btn.textContent = '📨 Je m\'inscris';
      show('L\'envoi n\'a pas abouti. Vérifiez votre connexion puis réessayez.');
      return;
    }
  }

  const body = [`IMMERSION CENTRE DE LOISIRS — ${data.t||''}`, `Parent : ${prenom} ${nom}`, `Créneau : ${creneauLabel(creneau)}`].join('\n');
  if(data.e) window.location.href = `mailto:${data.e}?subject=${encodeURIComponent('Immersion centre de loisirs — '+prenom+' '+nom)}&body=${encodeURIComponent(body)}`;
  try{ localStorage.setItem(STORE, JSON.stringify(rec)); }catch(e){}
  content.innerHTML = headerBlocks() + doneBlock(rec, false);
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
</body>
</html>
